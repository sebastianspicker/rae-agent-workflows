name: operator-demo-pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/operator-demo-pages.yml"
      - "apps/operator/**"
      - "docs/**"
      - "scripts/src/copy-docs-site.ts"
  workflow_dispatch:

concurrency:
  group: operator-demo-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

defaults:
  run:
    shell: node scripts/src/ci-command.ts {0}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
      - name: Install and build packages
        run: '[ ["npm", "ci", "--ignore-scripts"], ["npm", "run", "build"] ]'
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Build interactive mock demo
        run: '["node", "apps/operator/dist/scripts/build-demo.js", "--out", ".runtime/operator-demo"]'
      - name: Build documentation site
        run: '["npm", "run", "docs:build"]'
      - name: Add documentation site to the Pages output
        run: '["node", "scripts/dist/copy-docs-site.js"]'
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: .runtime/operator-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
