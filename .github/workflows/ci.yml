name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Install CLI dependencies
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo jq ripgrep shellcheck
      - name: Install orchestration dependencies
        run: npm ci --prefix packages/orchestration
      - name: Verify
        run: ./scripts/verify.sh

  codacy-local:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install quality dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Install orchestration dependencies
        run: npm ci --prefix packages/orchestration
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Provision Codacy analyzers
        run: bash scripts/provision-codacy-tools.sh
      - name: Run local Codacy gate
        run: bash scripts/codacy-local.sh
      - name: Upload sanitized Codacy report
        if: ${{ always() && hashFiles('.codacy/reports/codacy-local-sanitized.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codacy-local-sanitized-report
          path: |
            .codacy/reports/codacy-local-sanitized.json
            .codacy/reports/codacy-local-native-tool-versions.json
          if-no-files-found: error
