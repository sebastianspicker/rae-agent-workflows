name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs dependencies
        run: python -m pip install -r requirements-docs.txt pytest
      - name: Install CLI dependencies
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo jq ripgrep shellcheck
      - name: Verify
        run: ./scripts/verify.sh
