name: ci

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "20.19.0"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.6"
      - name: Install GNU Bash 5.3+
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install bash
          /home/linuxbrew/.linuxbrew/bin/bash --version
          /home/linuxbrew/.linuxbrew/bin/bash -c \
            '((BASH_VERSINFO[0] > 5 || (BASH_VERSINFO[0] == 5 && BASH_VERSINFO[1] >= 3)))'
          printf '%s\n' /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
      - name: Assert Python runtime
        run: |
          python -c 'import sys; assert sys.version_info[:3] == (3, 14, 6), sys.version'
      - name: Install Python verification dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Install CLI dependencies
        run: sudo apt-get update && sudo apt-get install -y git-filter-repo jq ripgrep shellcheck
      - name: Install orchestration dependencies
        run: npm ci --prefix packages/orchestration
      - name: Verify
        shell: /home/linuxbrew/.linuxbrew/bin/bash {0}
        run: ./scripts/verify.sh

  codacy-local:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-codacy.txt
      - name: Install quality dependencies
        run: python -m pip install --require-hashes -r requirements-codacy.txt
      - name: Install orchestration dependencies
        run: npm ci --prefix packages/orchestration
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Provision Codacy analyzers
        run: bash scripts/provision-codacy-tools.sh
      - name: Run local Codacy gate
        run: bash scripts/codacy-local.sh
      - name: Upload sanitized Codacy report
        if: ${{ always() && hashFiles('.codacy/reports/codacy-local-sanitized.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codacy-local-sanitized-report
          path: |
            .codacy/reports/codacy-local-sanitized.json
            .codacy/reports/codacy-local-native-tool-versions.json
          if-no-files-found: error
