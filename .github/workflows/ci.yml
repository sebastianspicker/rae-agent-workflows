name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: node scripts/src/ci-command.ts {0}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["24", "26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked packages
        run: '[ ["npm", "ci", "--ignore-scripts"], ["npm", "ci", "--prefix", "apps/platform", "--ignore-scripts"] ]'
      - name: Build compiled commands
        run: '["npm", "run", "build"]'
      - name: Verify prepared checkout
        run: '["npm", "run", "verify", "--", "--skip-install"]'
      - name: Build experimental platform image
        if: runner.os == 'Linux' && matrix.node == '24'
        run: '["docker", "build", "-f", "apps/platform/Dockerfile", "-t", "rae-platform-ci", "."]'
      - name: Smoke experimental platform image
        if: runner.os == 'Linux' && matrix.node == '24'
        run: '["docker", "run", "--rm", "--entrypoint", "node", "rae-platform-ci", "/app/scripts/dist/container-check.js"]'
      - name: Build product tool images
        if: runner.os == 'Linux' && matrix.node == '24'
        run: >-
          [["docker", "build", "-f", "packages/dev-tools/quality-gate/sandbox/Dockerfile", "-t", "rae-tool-ci-quality-gate", "."],
          ["docker", "build", "-f", "packages/dev-tools/multi-model-review/sandbox/Dockerfile", "-t", "rae-tool-ci-multi-model-review", "."],
          ["docker", "build", "-f", "packages/dev-tools/trace-collector/sandbox/Dockerfile", "-t", "rae-tool-ci-trace-collector", "."]]
      - name: Smoke product tool images
        if: runner.os == 'Linux' && matrix.node == '24'
        run: >-
          [["docker", "run", "--rm", "rae-tool-ci-quality-gate", "--healthcheck"],
          ["docker", "run", "--rm", "rae-tool-ci-multi-model-review", "--healthcheck"],
          ["docker", "run", "--rm", "rae-tool-ci-trace-collector", "--healthcheck"]]
