changelog:
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Documentation and maintenance
      labels:
        - documentation
        - maintenance
    - title: Dependencies
      labels:
        - dependencies
  exclude:
    labels:
      - skip-changelog
