name: Bug report
description: Report a reproducible problem in RAE.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not disclose vulnerabilities here. Use [private vulnerability reporting](https://github.com/sebastianspicker/rae/security/advisories/new).
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest command or steps that reproduce the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, GNU Bash, Python, Node.js, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized diagnostics
      description: Paste relevant output after removing credentials, private paths, and sensitive repository content.
