version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /packages/orchestration
    schedule:
      interval: weekly
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-development:
        update-types:
          - minor
          - patch
  - package-ecosystem: docker
    directory: /packages/orchestration/skills/dev-tools/multi-model-review/sandbox
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /packages/orchestration/skills/dev-tools/quality-gate/sandbox
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /packages/orchestration/skills/dev-tools/trace-collector/sandbox
    schedule:
      interval: weekly
