version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/platform
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /packages/dev-tools/multi-model-review/sandbox
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /packages/dev-tools/quality-gate/sandbox
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /packages/dev-tools/trace-collector/sandbox
    schedule:
      interval: weekly
