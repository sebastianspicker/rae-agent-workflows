<svg xmlns="http://www.w3.org/2000/svg" width="960" height="462" viewBox="0 0 960 462" role="img" aria-labelledby="title description">
  <title id="title">RAE command map</title>
  <desc id="description">Deterministic terminal capture generated from the live RAE CLI.</desc>
  <style>
    .line { fill: #e6edf3; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .chrome { fill: #8b949e; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect width="960" height="462" rx="14" fill="#0d1117"/>
  <rect width="960" height="44" rx="14" fill="#161b22"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="22" r="6" fill="#27c93f"/>
  <text x="88" y="27" class="chrome">RAE command map</text>
    <text x="32" y="76" class="line">$ npm run rae -- --help</text>
    <text x="32" y="98" class="line"></text>
    <text x="32" y="120" class="line">Usage: npm run rae -- &lt;command&gt; [args]</text>
    <text x="32" y="142" class="line"></text>
    <text x="32" y="164" class="line">Commands:</text>
    <text x="32" y="186" class="line">  verify [options]                  Run repository verification</text>
    <text x="32" y="208" class="line">  doctor                            Check Node and compiled package entrypoints</text>
    <text x="32" y="230" class="line">  agent &lt;subcommand&gt; [args]         Autonomous coding-agent orchestrator</text>
    <text x="32" y="252" class="line">  graph &lt;subcommand&gt; [args]         Repository graph projections and memory</text>
    <text x="32" y="274" class="line">  operator serve [args]             Authenticated loopback operator console</text>
    <text x="32" y="296" class="line">  orchestrate &lt;subcommand&gt; [args]   Staged workflow interface</text>
    <text x="32" y="318" class="line">  worktree &lt;subcommand&gt; [args]      Worktree orchestration aliases</text>
    <text x="32" y="340" class="line">  ralph [args]                      Ralph story loop and embedded bootstrap</text>
    <text x="32" y="362" class="line">  hygiene coauthor-cleaner [args]   Narrow history maintenance</text>
    <text x="32" y="384" class="line">  profile &lt;install|uninstall&gt; [args]  Agent profile transactions</text>
    <text x="32" y="406" class="line">  workflow &lt;family&gt; [args]          Autonomous, repo-audit and long-horizon aliases</text>
    <text x="32" y="428" class="line">  help                              Show this help</text>
</svg>
