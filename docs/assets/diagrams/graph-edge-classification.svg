<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">RAE graph edge classification</title>
  <desc id="desc">Four labeled edge types connect contract-bound workflow nodes: artifact data, item stream, condition, and loop-back.</desc>
  <rect width="900" height="420" rx="24" fill="#f5f8f7"/>
  <text x="48" y="58" fill="#17324d" font-size="28" font-family="sans-serif" font-weight="700">RAE edge contracts</text>
  <g font-family="sans-serif" font-size="17" fill="#17324d">
    <rect x="70" y="100" width="180" height="58" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="2"/><text x="98" y="135">Typed artifact</text>
    <path d="M250 129 H650" stroke="#087c82" stroke-width="5"/><path d="M650 129 l-14 -9 v18 z" fill="#087c82"/><text x="394" y="116">artifact</text>
    <rect x="650" y="100" width="180" height="58" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="2"/><text x="690" y="135">Consumer</text>
    <rect x="70" y="182" width="180" height="58" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="2"/><text x="108" y="217">Map item</text>
    <path d="M250 211 H650" stroke="#087c82" stroke-width="5" stroke-dasharray="8 7"/><path d="M650 211 l-14 -9 v18 z" fill="#087c82"/><text x="401" y="198">stream</text>
    <rect x="650" y="182" width="180" height="58" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="2"/><text x="683" y="217">Mapped stage</text>
    <rect x="70" y="264" width="180" height="58" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="2"/><text x="116" y="299">Decision</text>
    <path d="M250 293 H650" stroke="#a05a00" stroke-width="4" stroke-dasharray="14 8"/><path d="M650 293 l-14 -9 v18 z" fill="#a05a00"/><text x="386" y="280">condition</text>
    <rect x="650" y="264" width="180" height="58" rx="10" fill="#ffffff" stroke="#17324d" stroke-width="2"/><text x="700" y="299">Route</text>
    <path d="M700 350 C610 402 300 402 205 350" fill="none" stroke="#774694" stroke-width="4" stroke-dasharray="4 7"/><path d="M205 350 l15 -3 -6 14 z" fill="#774694"/><text x="400" y="390">bounded loop-back</text>
  </g>
</svg>
