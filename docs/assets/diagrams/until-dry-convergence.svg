<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">RAE until-dry discovery convergence</title>
  <desc id="desc">Discovery rounds admit only unseen stable keys, record accepted and rejected keys in the seen set, and stop when a round yields no new item.</desc>
  <rect width="900" height="420" rx="24" fill="#f5f8f7"/>
  <g font-family="sans-serif" fill="#17324d"><text x="48" y="54" font-size="27" font-weight="700">Until-dry means globally unseen</text>
    <g fill="#fff" stroke="#17324d" stroke-width="2"><rect x="60" y="112" width="190" height="70" rx="10"/><rect x="355" y="112" width="190" height="70" rx="10"/><rect x="650" y="112" width="190" height="70" rx="10"/></g>
    <g font-size="16"><text x="89" y="143">Round 1: A, B, C</text><text x="89" y="165">fresh: A, B, C</text><text x="382" y="143">Round 2: B, D</text><text x="382" y="165">fresh: D</text><text x="683" y="143">Round 3: A, D</text><text x="683" y="165">fresh: none</text></g>
    <g stroke="#087c82" stroke-width="4"><path d="M250 147 H355"/><path d="M545 147 H650"/></g>
    <rect x="208" y="256" width="484" height="72" rx="12" fill="#e7f3f6" stroke="#087c82" stroke-width="2"/><text x="247" y="286" font-size="17">seen keys after every decision: A, B, C, D</text><text x="306" y="312" font-size="17">no fresh key means converged</text>
    <text x="108" y="377" font-size="15">Rejected findings remain seen, so the loop cannot rediscover them indefinitely.</text>
  </g>
</svg>
