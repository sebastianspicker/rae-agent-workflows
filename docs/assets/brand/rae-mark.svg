<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title description">
  <title id="title">RAE evidence trace mark</title>
  <desc id="description">A stepped calibration trace crosses two checkpoints and ends in a verified evidence square.</desc>
