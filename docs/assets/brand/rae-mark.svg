  <path d="M10 17h13v15h17v15h14" fill="none" stroke="#1F5EFF" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  <rect x="19" y="13" width="9" height="9" fill="#14232B" stroke="#F4F7F8" stroke-width="2"/>
  <rect x="36" y="28" width="9" height="9" fill="#14232B" stroke="#A94725" stroke-width="2"/>
  <path d="M31 25v6M34 25v6" stroke="#CBD5DA" stroke-width="1"/>
  <rect x="49" y="42" width="10" height="10" fill="#08735F" stroke="#F4F7F8" stroke-width="2"/>
</svg>
